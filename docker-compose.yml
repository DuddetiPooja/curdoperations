services:
  flask_app:
    container_name: taskflow_app
    build: .
    ports:
      - "4000:4000"
    environment:
      DB_URL: postgresql://postgres:postgres@flask_db:5432/taskflow
      SECRET_KEY: taskflow-development-secret
    depends_on:
      flask_db:
        condition: service_healthy

  flask_db:
    container_name: taskflow_db
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: taskflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
