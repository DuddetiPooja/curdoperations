<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopFlow | E-commerce Dashboard</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

  <div id="toast" class="toast"></div>

  <!-- AUTH SCREEN -->

  <section id="auth-screen" class="auth-screen">

```
<div class="auth-card">

  <div class="brand">
    <span>SF</span> ShopFlow
  </div>

  <p class="muted">
    Simple e-commerce management
  </p>

  <div class="auth-tabs">
    <button class="tab active" data-auth="login">
      Login
    </button>

    <button class="tab" data-auth="register">
      Register
    </button>
  </div>


  <!-- LOGIN -->

  <form id="login-form" class="auth-form">

    <label>
      Username or Email
      <input id="login-identifier" required>
    </label>

    <label>
      Password
      <input
        id="login-password"
        type="password"
        required
      >
    </label>

    <button class="primary-btn" type="submit">
      Login
    </button>

  </form>


  <!-- REGISTER -->

  <form id="register-form" class="auth-form hidden">

    <label>
      Username
      <input id="register-username" required>
    </label>

    <label>
      Email
      <input
        id="register-email"
        type="email"
        required
      >
    </label>

    <label>
      Password
      <input
        id="register-password"
        type="password"
        minlength="6"
        required
      >
    </label>

    <button class="primary-btn" type="submit">
      Create Account
    </button>

  </form>

</div>
```

  </section>

  <!-- E-COMMERCE APP -->

  <section id="app-screen" class="app-screen hidden">

```
<!-- TOP BAR -->

<header class="topbar">

  <div class="brand">
    <span>SF</span> ShopFlow
  </div>

  <div class="user-area">

    <span id="welcome-user"></span>

    <button
      id="logout-btn"
      class="outline-btn"
    >
      Logout
    </button>

  </div>

</header>


<main class="container">


  <!-- PAGE HEADING -->

  <div class="page-heading">

    <div>

      <p class="eyebrow">
        E-COMMERCE DASHBOARD
      </p>

      <h1>
        Manage your products
      </h1>

      <p class="muted">
        Add, organize and manage your products in one place.
      </p>

    </div>


    <button
      id="add-product-btn"
      class="primary-btn"
    >
      + Add Product
    </button>

  </div>


  <!-- STATISTICS -->

  <div class="stats-grid">

    <div class="stat-card">
      <span>Total Products</span>
      <strong id="total-count">0</strong>
    </div>

    <div class="stat-card">
      <span>Available</span>
      <strong id="available-count">0</strong>
    </div>

    <div class="stat-card">
      <span>Out of Stock</span>
      <strong id="out-of-stock-count">0</strong>
    </div>

  </div>


  <!-- SEARCH AND FILTER -->

  <div class="toolbar">

    <input
      id="search-input"
      placeholder="Search products..."
    >


    <select id="category-filter">

      <option>All</option>

      <option>Electronics</option>

      <option>Clothing</option>

      <option>Books</option>

      <option>Home</option>

      <option>Beauty</option>

      <option>Sports</option>

    </select>


    <select id="stock-filter">

      <option>All</option>

      <option>Available</option>

      <option>Out of Stock</option>

    </select>

  </div>


  <!-- PRODUCT LIST -->

  <div
    id="product-list"
    class="product-list"
  ></div>

</main>
```

  </section>

  <!-- PRODUCT MODAL -->

  <div
    id="product-modal"
    class="modal hidden"
  >

```
<div class="modal-card">


  <div class="modal-header">

    <h2 id="modal-title">
      Add Product
    </h2>

    <button
      id="close-modal"
      class="close-btn"
    >
      ×
    </button>

  </div>


  <!-- PRODUCT FORM -->

  <form id="product-form">

    <input
      id="product-id"
      type="hidden"
    >


    <label>
      Product Name

      <input
        id="product-name"
        required
        maxlength="150"
      >

    </label>


    <label>

      Product Description

      <textarea
        id="product-description"
        rows="4"
        placeholder="Enter product description..."
      ></textarea>

    </label>


    <div class="form-row">


      <label>

        Category

        <select id="product-category">

          <option selected>
            Electronics
          </option>

          <option>
            Clothing
          </option>

          <option>
            Books
          </option>

          <option>
            Home
          </option>

          <option>
            Beauty
          </option>

          <option>
            Sports
          </option>

        </select>

      </label>


      <label>

        Stock Status

        <select id="product-stock-status">

          <option selected>
            Available
          </option>

          <option>
            Out of Stock
          </option>

        </select>

      </label>

    </div>


    <label>

      Price

      <input
        id="product-price"
        type="number"
        min="0"
        step="0.01"
        placeholder="Enter price"
        required
      >

    </label>


    <div class="modal-actions">

      <button
        type="button"
        id="cancel-btn"
        class="outline-btn"
      >
        Cancel
      </button>


      <button
        type="submit"
        class="primary-btn"
      >
        Save Product
      </button>

    </div>

  </form>

</div>
```

  </div>

  <!-- JAVASCRIPT -->

  <script src="/static/js/app.js"></script>

</body>
</html>
