<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopFlow | Register</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="auth-screen">

    <div class="auth-card">

        <div class="brand">
            <span>SF</span>
            ShopFlow
        </div>

        <h2>Create Account</h2>

        <p class="muted">
            Create your ShopFlow account.
        </p>


        <form id="register-form" class="auth-form">

            <label>
                Username

                <input
                    type="text"
                    id="register-username"
                    placeholder="Enter username"
                    required
                >
            </label>


            <label>
                Email

                <input
                    type="email"
                    id="register-email"
                    placeholder="Enter your email"
                    required
                >
            </label>


            <label>
                Password

                <input
                    type="password"
                    id="register-password"
                    placeholder="Create a password"
                    required
                >
            </label>


            <label>
                Confirm Password

                <input
                    type="password"
                    id="register-confirm-password"
                    placeholder="Confirm your password"
                    required
                >
            </label>


            <button
                type="submit"
                class="primary-btn">
                Register
            </button>

        </form>


        <p class="muted">
            Already have an account?

            <a
                href="/login.html"
                style="color:#4f46e5;font-weight:700;">
                Login
            </a>
        </p>


        <p>
            <a href="/index.html">
                ← Back to Home
            </a>
        </p>

    </div>

</div>


<script src="/static/js/auth.js"></script>

</body>

</html>
